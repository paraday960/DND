plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ir.paraday.dndbot'
    compileSdk 34

    defaultConfig {
        applicationId "ir.paraday.dndbot"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndkVersion "25.2.9519653"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        python {
            version "3.10"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
}
